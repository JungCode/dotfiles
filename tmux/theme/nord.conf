# Nord theme, using the real arcticicestudio/nord-tmux plugin (vendored
# under plugins/nord-tmux) instead of hand-overriding catppuccin's colors --
# that approach kept breaking because catppuccin bakes several formats
# eagerly at `run` time, so anything set afterward arrived too late. This
# plugin is fully self-contained: colors, pane borders, tab styling, status
# bar. It relies on named ANSI colors (black/blue/cyan/...), which kitty
# maps to the Nord palette via theme/switch.sh swapping kitty's own
# theme-active.conf symlink to nord.conf at the same time.

run ~/dotfiles/tmux/plugins/nord-tmux/nord.tmux

# nord-tmux stock format already uses the right Powerline triangle glyphs
# (U+E0B0/U+E0B1) -- only #W (window/running-command name) is swapped for
# the folder basename here, to match catppuccin's tab convention.
set -g window-status-format "#[fg=black,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#I #[fg=white,bg=brightblack,nobold,noitalics,nounderscore] #[fg=white,bg=brightblack]#{b:pane_current_path} #F #[fg=brightblack,bg=black,nobold,noitalics,nounderscore]"
set -g window-status-current-format "#[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#I #[fg=black,bg=cyan,nobold,noitalics,nounderscore] #[fg=black,bg=cyan]#{b:pane_current_path} #F #[fg=cyan,bg=black,nobold,noitalics,nounderscore]"

# nord-tmux doesn't set popup-style -- keep it transparent like every
# other pane, consistent with the catppuccin theme.
set -g popup-style "bg=default"
set -g popup-border-style "fg=brightblack,bg=default"
