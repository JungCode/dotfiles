# Catppuccin theme (default look). Fully self-contained: colors, pane
# borders, tab styling, status bar. Sourced by tmux.conf as
# theme/active.conf -- swap the symlink and reload to switch themes; no
# state leaks into nord.conf or vice versa.

# --- Pane border ---
set -g pane-active-border-style "fg=#b4befe"
set -g pane-border-style "fg=#45475a"

# @catppuccin_* must be set BEFORE `run catppuccin.tmux` below -- the
# script bakes them into static formats on load; setting them after does
# nothing, since window-status-current separators use `set -o`
# (only-if-unset), so a stale value survives even reloads.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'left'
set -g @catppuccin_pane_border_status 'top'
set -g @catppuccin_pane_status_enabled 'yes'
set -g @catppuccin_window_current_text ' 󰣇 #{b:pane_current_path}'
set -g @catppuccin_window_text ' 󰆍 #{b:pane_current_path}'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'yes'
set -g @catppuccin_window_current_number_color '#{@thm_sapphire}'

# Catppuccin stores these generated separator values with "only if unset".
# Clear remnants from a previously loaded style so `rounded` can regenerate
# the focused tab's separators on every config reload.
set -gu @catppuccin_window_current_left_separator
set -gu @catppuccin_window_current_middle_separator
set -gu @catppuccin_window_current_right_separator

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# --- Post-plugin overrides ---
# Use Catppuccin's built-in `rounded` window-tab UI.  Keep this free of
# post-plugin window-status overrides so the plugin controls its own preset.

# catppuccin (tmux >= 3.4) sets popup-style/popup-border-style to a solid
# @thm_bg fill, which kills kitty's background_opacity for tmux popups
# (prefix g scratch session). Force them back to "default" so the popup
# stays transparent like every other pane.
set -g popup-style "bg=default"
set -g popup-border-style "fg=#45475a,bg=default"

# --- Status bar ---
# left: session only. right: application, directory, cpu, battery, uptime.
set -g status-left-length 30
set -g status-left "#[fg=#{E:@catppuccin_session_color}]#{E:@catppuccin_session_icon}#{E:@catppuccin_session_text} #[default]"
set -g window-status-separator ""

# Plain text instead of catppuccin's icon-chip pills (colored background
# boxes) -- those always show the icon flush against the chip's left edge
# with padding only on the right, which reads as misaligned. Reusing the
# catppuccin *_text/*_icon vars (no background) keeps the same underlying
# data/scripts without the chip styling.
#
# cpu/battery need -agF (flatten now, not lazily) so that by the time tmux-cpu
# and tmux-battery run (sourced below via tpm), status-right literally contains
# their #{cpu_percentage}/#{battery_icon} placeholders to substitute — a lazy
# #{E:...} reference here never gets seen by those plugins' substitution pass.
set -g status-right-length 60
set -g status-right "#[fg=#{@thm_overlay_1}]#{E:@catppuccin_application_icon}#{E:@catppuccin_application_text} #[fg=#{@thm_surface_2}]│ #[fg=#{@thm_rosewater}]#{E:@catppuccin_directory_icon}#{E:@catppuccin_directory_text} #[fg=#{@thm_surface_2}]│ "
set -agF status-right "#[fg=#{@thm_yellow}]#{E:@catppuccin_cpu_icon}#{E:@catppuccin_cpu_text} "
set -ag status-right "#[fg=#{@thm_surface_2}]│ "
set -agF status-right "#[fg=#{@thm_lavender}]#{E:@catppuccin_battery_icon}#{E:@catppuccin_battery_text} "
set -ag status-right "#[fg=#{@thm_surface_2}]│ #[fg=#{@thm_sapphire}]#{E:@catppuccin_uptime_icon}#{E:@catppuccin_uptime_text}#[default]"
