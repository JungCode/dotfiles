# Rose Pine (main) theme. Hand-written and fully self-contained -- no tpm
# plugin to vendor, unlike catppuccin.conf / nord.conf. Colors are literal
# hex so this stays correct regardless of which kitty palette is loaded,
# and nothing leaks into or out of the other theme files.

# --- Palette (rose-pine main) ---
# base #191724  surface #1f1d2e  overlay #26233a
# muted #6e6a86 subtle #908caa   text #e0def4
# love #eb6f92  gold #f6c177     rose #ebbcba
# pine #31748f  foam #9ccfd8     iris #c4a7e7
# highlight-med #403d52

# --- Pane border ---
set -g pane-active-border-style "fg=#c4a7e7"
set -g pane-border-style "fg=#403d52"
set -g pane-border-status top
set -g pane-border-format " #[fg=#6e6a86]#{pane_index} #{pane_current_command} "

# --- Popups: keep transparent so kitty's background_opacity applies ---
set -g popup-style "bg=default"
set -g popup-border-style "fg=#403d52,bg=default"

# --- Message / mode ---
set -g message-style "fg=#e0def4,bg=#26233a"
set -g message-command-style "fg=#e0def4,bg=#26233a"
set -g mode-style "fg=#191724,bg=#ebbcba"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#908caa,bg=default"
set -g window-status-separator ""

# left: session name only, matching catppuccin.conf's convention.
set -g status-left-length 30
set -g status-left "#[fg=#c4a7e7,bold] #S #[default]"

# Separate rounded capsules for inactive and focused window tabs.
set -g window-status-format "#[fg=#26233a,bg=default]#[fg=#908caa,bg=#26233a] #I 󰆍 #{b:pane_current_path} #[fg=#26233a,bg=default]"
set -g window-status-current-format "#[fg=#9ccfd8,bg=default]#[fg=#191724,bg=#9ccfd8,bold] #I 󰣇 #{b:pane_current_path} #[fg=#9ccfd8,bg=default]"

# right: directory, cpu, battery, uptime. #{cpu_percentage} / #{battery_icon}
# are written literally here so tmux-cpu and tmux-battery (loaded by tpm
# after this file is sourced) can substitute them.
set -g status-right-length 60
set -g status-right "#[fg=#ebbcba]󰉋 #{b:pane_current_path} #[fg=#403d52]│ "
set -ag status-right "#[fg=#f6c177]󰍛 #{cpu_percentage} #[fg=#403d52]│ "
set -ag status-right "#[fg=#c4a7e7]#{battery_icon} #{battery_percentage} #[fg=#403d52]│ "
set -ag status-right "#[fg=#9ccfd8]󰅐 #(uptime | sed 's/.*up \\([^,]*\\),.*/\\1/')#[default]"
