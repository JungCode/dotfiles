# Recovered tmux.conf — reconstructed from the live server after the original file was lost.
# The options and key bindings below were captured from the running session.

# --- General settings ---
set -g mouse on                  # Enable clicking, scrolling, and mouse-based pane resizing.
set -g mode-keys vi             # Use Vim keys in tmux copy mode.
# In copy mode: use v to begin a character-wise visual selection, then y to
# send exactly that selection to the macOS clipboard and leave copy mode.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
set -g history-limit 50000      # Keep up to 50,000 lines of scrollback per pane.
set -g display-time 4000        # Show tmux messages for four seconds.
set -g status-interval 5        # Refresh the status bar every five seconds.
set -g base-index 0             # Number windows starting from zero.
set -g pane-base-index 0        # Number panes starting from zero.
set -g renumber-windows off     # Do not renumber windows after one is closed.
set -g set-titles off           # Do not let tmux change the Kitty window title.
set -g automatic-rename off     # Do not rename windows after the running program.
set -g default-shell /bin/zsh   # Start Zsh in every new pane.

# --- Create new windows and panes in the current directory ---
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Use Prefix + h/j/k/l to navigate panes like Vim ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Use Prefix + H/J/K/L to resize panes; hold the key to repeat ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Use Prefix + R to reload this config ---
bind R run-shell " \
		tmux source-file ~/.tmux.conf > /dev/null; \
		tmux display-message 'Sourced ~/.tmux.conf!'"

# --- Use Prefix + g to open the `popup` session in a floating window ---
bind -r g if-shell "tmux has-session -t popup 2>/dev/null" \
  "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'tmux attach-session -t popup'" \
  "display-popup -d '#{pane_current_path}' -w 80% -h 80% -E 'tmux new-session -s popup -c \"#{pane_current_path}\"'"

# --- Plugins (TPM) ---
# catppuccin is vendored manually under plugins/catppuccin (not TPM-managed) —
# it must be sourced explicitly, before status-right/status-left are built, so
# that tmux-cpu/tmux-battery can find their placeholders once flattened in.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Add matching plugins here if kube, weather, or pomodoro status modules are enabled.

# --- Resurrect / Continuum ---
set -g @resurrect-capture-pane-contents on
set -g @resurrect-strategy-vim session
set -g @resurrect-strategy-nvim session
set -g @continuum-restore on
set -g @continuum-save-interval 15

# --- Theme ---
# theme/switch.sh flips this symlink between theme/catppuccin.conf,
# theme/nord.conf and theme/rose-pine.conf -- each is fully self-contained (colors, pane borders,
# tab styling, status bar), so switching never leaves stale state baked
# in from the other theme.
source-file ~/dotfiles/tmux/theme/active.conf

# --- Initialize TPM (keep this line at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'
